<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support Ticket Triage v2 — Secure</title>

<style>
body {
    font: 15px system-ui, sans-serif;
    background: #f5f7fb;
    color: #172333;
    max-width: 950px;
    margin: 35px auto;
    padding: 0 18px;
}
h1 { font-size: 26px; }
.box {
    background: white;
    border: 1px solid #e0e5ee;
    border-radius: 12px;
    padding: 18px;
    margin: 16px 0;
}
input, textarea, select {
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #adb9ca;
    border-radius: 8px;
    font: inherit;
}
input { width: 100%; margin: 5px 0 12px; }
textarea { width: 100%; min-height: 100px; }
button {
    padding: 10px 14px;
    border: 1px solid #a6b5c7;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    margin: 3px;
}
button.primary {
    background: #245cc8;
    color: white;
    border: none;
}
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
table {
    width: 100%;
    border-collapse: collapse;
}
td, th {
    text-align: left;
    border-bottom: 1px solid #e8ecf2;
    padding: 10px;
    font-size: 13px;
}
.muted { color: #687789; }
.tag {
    background: #dce8fa;
    padding: 4px 8px;
    border-radius: 12px;
}
.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}
[hidden] { display: none !important; }
</style>
</head>

<body>

<h1>Support Ticket Triage
    <span class="tag">Secure Local AI</span>
</h1>

<p class="muted">
    FastAPI + LangGraph + Qwen3 4B + SQLite
</p>

<div id="auth-panel" class="box">
    <h2>Login</h2>

    <label for="username">Username</label>
    <input id="username" autocomplete="username">

    <label for="password">Password</label>
    <input
        id="password"
        type="password"
        autocomplete="current-password"
    >

    <button id="login-btn" class="primary" onclick="login()">
        Login
    </button>

    <button id="register-btn" onclick="register()">
        Register Customer
    </button>

    <p id="auth-message" class="muted" role="status"></p>
</div>

<div id="dashboard" hidden>

    <div class="box row">
        <div>
            <strong id="current-user"></strong>
            <p class="muted" id="current-role"></p>
        </div>
        <button id="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="box">
        <h2>New Ticket</h2>

        <textarea
            id="ticket"
            placeholder="Describe your support issue..."
        ></textarea>

        <p>
            <button class="primary" onclick="submitTicket()">
                Submit ticket
            </button>
            <span id="message" class="muted"></span>
        </p>

        <pre id="result"></pre>
    </div>

    <div class="box">
        <h2>Tickets</h2>

        <button onclick="loadTickets()">Refresh</button>

        <select id="filter" onchange="loadTickets()">
            <option value="">All</option>
            <option value="pending_review">Pending review</option>
            <option value="assigned">Assigned</option>
            <option value="in_progress">In progress</option>
            <option value="resolved">Resolved</option>
        </select>

        <div id="table"></div>
    </div>

    <div class="box">
        <h2>Ticket Details / Workflow</h2>

        <p class="muted" id="permissions"></p>

        <div id="selected"></div>
    </div>

</div>

<script>
let accessToken = null;
let currentUser = null;
let selected = null;

const $ = id => document.getElementById(id);

function show(id, value) {
    $(id).textContent =
        typeof value === "string"
            ? value
            : JSON.stringify(value, null, 2);
}

function staff() {
    return currentUser &&
        ["support", "admin"].includes(currentUser.role);
}

function clearSession(message = "") {
    accessToken = null;
    currentUser = null;
    selected = null;

    $("dashboard").hidden = true;
    $("auth-panel").hidden = false;

    $("password").value = "";
    $("auth-message").textContent = message;
}

function logout() {
    clearSession("Logged out");
}

async function req(url, opts = {}) {
    const headers = {
        ...(opts.headers || {})
    };

    if (accessToken) {
        headers["Authorization"] = "Bearer " + accessToken;
    }

    const response = await fetch(url, {
        ...opts,
        headers
    });

    let data;

    try {
        data = await response.json();
    } catch {
        data = {};
    }

    if (!response.ok) {
        if (response.status === 401 && accessToken) {
            clearSession("Session expired. Please log in again.");
        }

        throw Error(
            typeof data.detail === "string"
                ? data.detail
                : JSON.stringify(data.detail || data)
        );
    }

    return data;
}

async function register() {
    try {
        const username = $("username").value.trim();
        const password = $("password").value;

        await req("/auth/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username, password})
        });

        show(
            "auth-message",
            "Customer registered. You can now log in."
        );

    } catch (e) {
        show("auth-message", e.message);
    }
}

async function login() {
    try {
        const credentials = {
            username: $("username").value.trim(),
            password: $("password").value
        };

        const result = await req("/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(credentials)
        });

        accessToken = result.access_token;

        currentUser = await req("/auth/me");

        $("current-user").textContent = credentials.username;
        $("current-role").textContent =
            "Role: " + currentUser.role;

        $("permissions").textContent = staff()
            ? "Support staff: review and status management enabled."
            : "Customer: only your own tickets are displayed.";

        $("auth-panel").hidden = true;
        $("dashboard").hidden = false;

        $("password").value = "";

        show("result", "");
        show("message", "");
        show("selected", "");

        await loadTickets();

    } catch (e) {
        show("auth-message", e.message);
    }
}

async function submitTicket() {
    try {
        show("message", "Processing locally...");

        const ticket = await req("/tickets", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                ticket_text: $("ticket").value
            })
        });

        show("result", ticket);
        show("message", "Ticket created");

        await loadTickets();

    } catch (e) {
        show("message", e.message);
    }
}

async function loadTickets() {
    try {
        const status = $("filter").value;
        const url = "/tickets" + (
            status ? "?status=" + encodeURIComponent(status) : ""
        );

        const rows = await req(url);
        const container = $("table");

        container.replaceChildren();

        const table = document.createElement("table");
        const header = document.createElement("tr");

        ["ID", "Category", "Team", "Priority", "Status"]
            .forEach(name => {
                const th = document.createElement("th");
                th.textContent = name;
                header.appendChild(th);
            });

        table.appendChild(header);

        rows.forEach(ticket => {
            const tr = document.createElement("tr");

            [
                ticket.id,
                ticket.issue_category || "—",
                ticket.assigned_team,
                ticket.priority || "—",
                ticket.status
            ].forEach(value => {
                const td = document.createElement("td");
                td.textContent = value;
                tr.appendChild(td);
            });

            tr.style.cursor = "pointer";
            tr.onclick = () => selectTicket(ticket.id);

            table.appendChild(tr);
        });

        container.appendChild(table);

    } catch (e) {
        show("table", e.message);
    }
}

async function selectTicket(id) {
    try {
        selected = await req(
            "/tickets/" + encodeURIComponent(id)
        );

        const container = $("selected");
        container.replaceChildren();

        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(selected, null, 2);
        container.appendChild(pre);

        if (staff()) {
            if (selected.status === "pending_review") {
                const button = document.createElement("button");
                button.textContent = "Review and assign";
                button.onclick = review;
                container.appendChild(button);

            } else if (
                selected.status === "assigned" ||
                selected.status === "in_progress"
            ) {
                const button = document.createElement("button");

                button.textContent =
                    selected.status === "assigned"
                        ? "Mark in progress"
                        : "Resolve";

                button.onclick = advance;
                container.appendChild(button);
            }
        }

        const audit = document.createElement("button");
        audit.textContent = "View audit events";

        audit.onclick = async () => {
            try {
                const events = await req(
                    "/tickets/" +
                    encodeURIComponent(id) +
                    "/events"
                );

                const previous =
                    container.querySelector(".audit-events");
                if (previous) previous.remove();

                const output = document.createElement("pre");
                output.className = "audit-events";
                output.textContent = JSON.stringify(events, null, 2);

                container.appendChild(output);
            } catch (e) {
                alert(e.message);
            }
        };

        container.appendChild(audit);

    } catch (e) {
        show("selected", e.message);
    }
}

async function review() {
    if (!selected || !staff()) return;

    const category = prompt(
        "Correct category:",
        selected.issue_category || "other"
    );

    const priority = prompt(
        "Correct priority:",
        selected.priority || "medium"
    );

    const note = prompt(
        "Review note:",
        "Reviewed by support staff"
    );

    if (!category || !priority || !note) return;

    try {
        await req("/tickets/" + selected.id + "/review", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                issue_category: category,
                priority,
                note
            })
        });

        await selectTicket(selected.id);
        await loadTickets();

    } catch (e) {
        alert(e.message);
    }
}

async function advance() {
    if (!selected || !staff()) return;

    const status =
        selected.status === "assigned"
            ? "in_progress"
            : "resolved";

    try {
        await req("/tickets/" + selected.id + "/status", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                status,
                note: "Updated by authenticated support staff"
            })
        });

        await selectTicket(selected.id);
        await loadTickets();

    } catch (e) {
        alert(e.message);
    }
}
</script>
</body>
</html>
