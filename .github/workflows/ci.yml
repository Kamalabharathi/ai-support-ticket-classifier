name: AI Ticket Classifier CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run regression and security tests
        env:
          MODEL_PROVIDER: rules_demo
          APP_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: |
          pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ticket-classifier:test .

      - name: Start Docker container
        env:
          APP_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: |
          docker run -d \
            --name ticket-classifier-test \
            -p 8000:8000 \
            -e MODEL_PROVIDER=rules_demo \
            -e APP_JWT_SECRET="$APP_JWT_SECRET" \
            ticket-classifier:test

      - name: Verify health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "Docker health check passed"
              exit 0
            fi
            sleep 2
          done

          docker logs ticket-classifier-test
          exit 1

      - name: Show container logs
        if: always()
        run: |
          docker logs ticket-classifier-test || true

      - name: Stop test container
        if: always()
        run: |
          docker rm -f ticket-classifier-test || true
